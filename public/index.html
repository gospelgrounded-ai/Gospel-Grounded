<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Gospel Grounded — Video Editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #08080f;
      color: #fff;
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo h1 span { color: #e94560; }

    .logo p {
      font-size: 13px;
      color: #777;
      margin-top: 4px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 24px;
      max-width: 480px;
      margin: 0 auto 20px;
    }

    .drop-zone {
      border: 2px dashed rgba(233,69,96,0.5);
      border-radius: 12px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    .drop-zone:hover, .drop-zone.active {
      border-color: #e94560;
      background: rgba(233,69,96,0.06);
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .drop-zone h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .drop-zone p {
      font-size: 13px;
      color: #888;
    }

    #file-name {
      margin-top: 12px;
      font-size: 13px;
      color: #e94560;
      font-weight: 500;
      min-height: 18px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 16px;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary {
      background: #e94560;
      color: #fff;
    }

    .btn-download {
      background: #22c55e;
      color: #fff;
      text-decoration: none;
      text-align: center;
      display: none;
    }

    .progress-bar-wrap {
      background: rgba(255,255,255,0.08);
      border-radius: 6px;
      height: 8px;
      margin-top: 14px;
      overflow: hidden;
      display: none;
    }

    .progress-bar {
      height: 100%;
      background: #e94560;
      border-radius: 6px;
      width: 0%;
      transition: width 0.3s;
    }

    #upload-pct {
      font-size: 12px;
      color: #888;
      margin-top: 6px;
      display: none;
    }

    .stages {
      display: none;
      margin-top: 20px;
      gap: 10px;
      flex-direction: column;
    }

    .stage {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      font-size: 14px;
      color: #888;
      transition: color 0.3s, background 0.3s;
    }

    .stage.active {
      color: #fff;
      background: rgba(233,69,96,0.12);
    }

    .stage.done {
      color: #22c55e;
      background: rgba(34,197,94,0.08);
    }

    .stage.failed {
      color: #f87171;
      background: rgba(248,113,113,0.08);
    }

    .stage-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    .stage.active .stage-dot {
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    #status-msg {
      font-size: 13px;
      color: #aaa;
      margin-top: 14px;
      min-height: 18px;
      text-align: center;
    }

    .jobs-section { display: none; }

    .jobs-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .job-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      font-size: 13px;
    }

    .job-status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-done    { background: rgba(34,197,94,0.15); color: #22c55e; }
    .badge-failed  { background: rgba(248,113,113,0.15); color: #f87171; }
    .badge-active  { background: rgba(233,69,96,0.15); color: #e94560; }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="logo">
    <h1>Gospel <span>Grounded</span></h1>
    <p>AI-powered long-form video editor</p>
  </div>

  <!-- Upload card -->
  <div class="card" id="upload-card">
    <div class="drop-zone" id="drop-zone">
      <input type="file" id="file-input" accept=".mp4,.mov,.m4v" />
      <div class="drop-icon">🎬</div>
      <h3>Select or drop your video</h3>
      <p>MP4, MOV, M4V · Up to 10 GB · Up to 30 minutes</p>
      <div id="file-name"></div>
    </div>

    <div class="progress-bar-wrap" id="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div id="upload-pct"></div>

    <button class="btn btn-primary" id="upload-btn" disabled>Upload &amp; Edit</button>
    <a class="btn btn-download" id="download-btn" href="#" target="_blank">⬇ Download Edited Video</a>
  </div>

  <!-- Processing status card -->
  <div class="card" id="status-card" style="display:none;">
    <p class="section-title">Processing</p>
    <div class="stages" id="stages">
      <div class="stage" id="stage-transcribing">
        <div class="stage-dot"></div> Transcribing audio
      </div>
      <div class="stage" id="stage-planning">
        <div class="stage-dot"></div> Planning edits with Claude
      </div>
      <div class="stage" id="stage-rendering">
        <div class="stage-dot"></div> Rendering video
      </div>
    </div>
    <div id="status-msg"></div>
  </div>

  <!-- Previous jobs card -->
  <div class="card jobs-section" id="jobs-card">
    <p class="section-title">Recent Jobs</p>
    <div class="jobs-list" id="jobs-list"></div>
  </div>

  <script>
    const fileInput = document.getElementById('file-input');
    const fileName  = document.getElementById('file-name');
    const uploadBtn = document.getElementById('upload-btn');
    const progressWrap = document.getElementById('progress-wrap');
    const progressBar  = document.getElementById('progress-bar');
    const uploadPct    = document.getElementById('upload-pct');
    const downloadBtn  = document.getElementById('download-btn');
    const statusCard   = document.getElementById('status-card');
    const stagesEl     = document.getElementById('stages');
    const statusMsg    = document.getElementById('status-msg');
    const dropZone     = document.getElementById('drop-zone');

    let currentJobId = null;
    let sseSource = null;
    let pollInterval = null;

    // File selection
    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (file) {
        fileName.textContent = file.name + ' (' + formatBytes(file.size) + ')';
        uploadBtn.disabled = false;
      }
    });

    // Drag highlight
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('active'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('active'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('active');
      if (e.dataTransfer.files[0]) {
        fileInput.files = e.dataTransfer.files;
        fileInput.dispatchEvent(new Event('change'));
      }
    });

    // Upload
    uploadBtn.addEventListener('click', () => {
      const file = fileInput.files[0];
      if (!file) return;

      uploadBtn.disabled = true;
      progressWrap.style.display = 'block';
      uploadPct.style.display = 'block';
      downloadBtn.style.display = 'none';

      const formData = new FormData();
      formData.append('video', file);

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/upload');

      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const pct = Math.round((e.loaded / e.total) * 100);
          progressBar.style.width = pct + '%';
          uploadPct.textContent = 'Uploading… ' + pct + '%';
        }
      };

      xhr.onload = () => {
        if (xhr.status === 200) {
          const { jobId } = JSON.parse(xhr.responseText);
          currentJobId = jobId;
          uploadPct.textContent = 'Upload complete. Processing…';
          progressBar.style.width = '100%';
          statusCard.style.display = 'block';
          stagesEl.style.display = 'flex';
          startTracking(jobId);
          loadJobs();
        } else {
          uploadPct.textContent = 'Upload failed. Please try again.';
          uploadBtn.disabled = false;
        }
      };

      xhr.onerror = () => {
        uploadPct.textContent = 'Network error. Please try again.';
        uploadBtn.disabled = false;
      };

      xhr.send(formData);
    });

    function startTracking(jobId) {
      // SSE for live updates
      if (sseSource) sseSource.close();
      sseSource = new EventSource('/status/' + jobId);
      sseSource.onmessage = (e) => {
        try { applyJobUpdate(JSON.parse(e.data)); } catch (_) {}
      };
      sseSource.onerror = () => {
        sseSource.close();
        // Fall back to polling when SSE drops (e.g. screen lock)
        if (!pollInterval) {
          pollInterval = setInterval(() => pollJob(jobId), 5000);
        }
      };
    }

    function pollJob(jobId) {
      fetch('/api/jobs/' + jobId)
        .then(r => r.json())
        .then(job => {
          applyJobUpdate(job);
          if (job.status === 'done' || job.status === 'failed') {
            clearInterval(pollInterval);
            pollInterval = null;
          }
        })
        .catch(() => {});
    }

    function applyJobUpdate(job) {
      statusMsg.textContent = job.progress || '';
      setStage(job.status);

      if (job.status === 'done') {
        downloadBtn.href = '/download/' + job.id;
        downloadBtn.style.display = 'block';
        if (sseSource) sseSource.close();
        loadJobs();
      }

      if (job.status === 'failed') {
        statusMsg.textContent = '❌ ' + (job.error || 'Processing failed');
        uploadBtn.disabled = false;
        if (sseSource) sseSource.close();
      }
    }

    const stageOrder = ['transcribing', 'planning', 'rendering', 'done'];

    function setStage(status) {
      const idx = stageOrder.indexOf(status);
      ['transcribing', 'planning', 'rendering'].forEach((s, i) => {
        const el = document.getElementById('stage-' + s);
        el.className = 'stage';
        if (i < idx) el.classList.add('done');
        else if (i === idx || (status === 'done' && i === 2)) el.classList.add('done');
        else if (s === status) el.classList.add('active');
        if (status === 'failed') el.classList.add('failed');
      });
      if (status === 'transcribing') {
        document.getElementById('stage-transcribing').classList.add('active');
      } else if (status === 'planning') {
        document.getElementById('stage-transcribing').classList.replace('active', 'done') ||
          document.getElementById('stage-transcribing').classList.add('done');
        document.getElementById('stage-planning').classList.add('active');
      } else if (status === 'rendering') {
        document.getElementById('stage-transcribing').classList.add('done');
        document.getElementById('stage-planning').classList.add('done');
        document.getElementById('stage-rendering').classList.add('active');
      } else if (status === 'done') {
        document.getElementById('stage-transcribing').classList.add('done');
        document.getElementById('stage-planning').classList.add('done');
        document.getElementById('stage-rendering').classList.add('done');
      }
    }

    function loadJobs() {
      fetch('/api/jobs')
        .then(r => r.json())
        .then(jobs => {
          if (!jobs.length) return;
          const card = document.getElementById('jobs-card');
          const list = document.getElementById('jobs-list');
          card.style.display = 'block';
          list.innerHTML = jobs.slice(0, 5).map(j => {
            const label = j.status === 'done' ? 'Done' :
                          j.status === 'failed' ? 'Failed' : 'Processing';
            const cls   = j.status === 'done' ? 'badge-done' :
                          j.status === 'failed' ? 'badge-failed' : 'badge-active';
            const link  = j.status === 'done'
              ? `<a href="/download/${j.id}" style="color:#22c55e;font-size:13px;">Download</a>`
              : '';
            const name  = j.videoPath.split('/').pop() || j.id.slice(0, 8);
            return `<div class="job-item">
              <span>${name}</span>
              <div style="display:flex;align-items:center;gap:10px;">
                ${link}
                <span class="job-status-badge ${cls}">${label}</span>
              </div>
            </div>`;
          }).join('');
        })
        .catch(() => {});
    }

    function formatBytes(b) {
      if (b < 1024 ** 2) return (b / 1024).toFixed(1) + ' KB';
      if (b < 1024 ** 3) return (b / 1024 ** 2).toFixed(1) + ' MB';
      return (b / 1024 ** 3).toFixed(2) + ' GB';
    }

    // Resume tracking a job if user reloads the page mid-processing
    const savedJobId = sessionStorage.getItem('jobId');
    if (savedJobId) {
      fetch('/api/jobs/' + savedJobId)
        .then(r => r.json())
        .then(job => {
          if (job.status !== 'done' && job.status !== 'failed') {
            currentJobId = savedJobId;
            statusCard.style.display = 'block';
            stagesEl.style.display = 'flex';
            startTracking(savedJobId);
          }
        })
        .catch(() => {});
    }

    // Save job id to session so page reload can resume tracking
    const origStartTracking = startTracking;

    loadJobs();
  </script>
</body>
</html>
